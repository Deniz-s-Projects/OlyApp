arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-dir: lib/l10n/generated
# Flutter 3.27+ removed synthetic-package support. Generated sources are
# written into the package and imported via `package:oly_app/...`. They're
# emitted by `flutter pub get` (or `flutter gen-l10n`); see .gitignore.
synthetic-package: false
nullable-getter: false
